spring.application.name=DATN


# Cấu hình kết nối MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datn_demo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate=ERROR

logging.level.org.springframework.security=WARN


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OAuth2 redirect URL
oauth2.redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:3000/oauth2/redirect}

# Cookie secure (đặt true khi dùng HTTPS)
cookie.secure=${COOKIE_SECURE:false}

# VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/payment-result}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}